<!-- CTA -->
<div class="cta" id="contact">
<div class="wrap cta-g">
  <div class="rv">
    <span class="eyebrow" style="color:rgba(255,255,255,.7)">{{ contact.eyebrow }}</span>
    <h2 style="margin-top:14px">{{ contact.title }}</h2>
    <p class="lead">{{ contact.lead }}</p>
    <div class="cline">
      <div><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="flex-shrink:0"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/></svg> <div>{{ contacts.ceo }}<div class="role">{{ contacts.ceo_role }}</div></div></div>
      <a href="tel:{{ contacts.phone_raw }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="flex-shrink:0"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 015 5 2 2 0 015 4z"/></svg> {{ contacts.phone }}</a>
      <a href="mailto:{{ contacts.email }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="flex-shrink:0"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg> {{ contacts.email }}</a>
    </div>
  </div>
  <div class="form rv">
    <h3>{{ contact.whatsapp.title }}</h3>
    <p class="fs">{{ contact.whatsapp.subtitle }}</p>
    <a href="https://wa.me/{{ contacts.whatsapp_raw }}?text={{ contact.whatsapp.prefill | urlencode }}"
       target="_blank" rel="noopener"
       class="btn btn-whatsapp" style="width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.35 5.07L2 22l5.06-1.33A9.94 9.94 0 0012 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.66 0-3.2-.46-4.52-1.26l-.32-.19-3.01.79.8-2.93-.21-.3A7.94 7.94 0 014 12c0-4.41 3.59-8 8-8s8 3.59 8 8-3.59 8-8 8zm4.36-5.96c-.24-.12-1.42-.7-1.64-.78-.22-.08-.38-.12-.54.12-.16.24-.62.78-.76.94-.14.16-.28.18-.52.06-.24-.12-1.01-.37-1.92-1.18-.71-.63-1.19-1.42-1.33-1.66-.14-.24-.01-.37.11-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.19-.46-.39-.4-.54-.4-.14 0-.3-.02-.46-.02s-.42.06-.64.3c-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.7 2.6 4.12 3.64.58.25 1.03.4 1.38.51.58.18 1.11.16 1.53.1.47-.07 1.42-.58 1.62-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28z"/></svg>
      {{ contact.whatsapp.button }}
    </a>
    <small style="display:block;margin-top:14px">{{ contact.whatsapp.note }}</small>
  </div>
</div>
</div>
