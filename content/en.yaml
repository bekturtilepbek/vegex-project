quality:
  eyebrow: "Quality control"
  title: "Transparent, documented, verifiable"
  intro: "Every export shipment can be accompanied by a full set of documents. Independent inspection and laboratory testing available upon request."
  docs:
    sub: "Shipment documents"
    items:
      - "Commercial Invoice"
      - "Packing List"
      - "Certificate of Origin"
      - "Phytosanitary Certificate"
      - "Export Documents"
      - "Pre-shipment Inspection (PSI)"
    note: "Independent inspection available upon request:"
    chips:
      - { label: "SGS", hl: true }
      - { label: "Bureau Veritas", hl: true }
  lab:
    sub: "Laboratory testing"
    items:
      - "Allicin content analysis"
      - "Pest screening"
      - "Pesticide residue analysis"
      - "Microbiological analysis"
      - "GlobalG.A.P. certification (upon request)"
    note: "Conducted at accredited laboratories in:"
    chips:
      - { label: "Germany", code: "de", hl: true }
      - { label: "Dubai", code: "ae", hl: true }
    note2: "Additional certification requirements can be discussed if needed."
  gallery:
    eyebrow: "Visual documentation — provided to buyers upon request"
    pairs:
      - - { caption: "Garlic bulbs with a measuring tape", photo: "чеснок0295-редакт.", pos: "center 72%" }
