about:
  eyebrow: "About us"
  title: "An exporter building long-term partnerships"
  text: "VEGEX is a Kyrgyz export company specializing in the supply of fresh, premium garlic grown in the high-altitude regions of Kyrgyzstan. We supply carefully selected export-grade garlic to wholesalers, distributors, processors and retail chains in international markets."
  mission: "Our goal is to build long-term partnerships based on consistent product quality, transparent communication and reliable export logistics."

terroir:
  eyebrow: "Natural advantages"
  title: "Why Kyrgyz garlic"
  intro: "Our garlic is cultivated in mountainous regions at high altitudes, where unique natural conditions foster superior product quality."
  cards:
    - { title: "High-altitude cultivation", text: "Plantations above 1800 m — slow, natural maturing." }
    - { title: "Significant day/night temperature variation", text: "Concentrates flavour and bulb density." }
    - { title: "Fertile soil", text: "Rich mountain soil supports large calibers." }
    - { title: "Pristine mountain ecosystem", text: "Remote areas free from industrial pressure." }
    - { title: "Mountain water rich in natural minerals", text: "Irrigated with clean glacier and river water." }
    - { title: "Traditional cultivation methods", text: "Proven practices and careful manual sorting." }
    - { title: "Manual sorting", text: "Every bulb is visually inspected before packing." }
    - { title: "8–10 months shelf life", text: "Resilient through long-distance transport and storage." }
    - { title: "Transparency at every stage", text: "Full traceability from field to shipment, documented at every step." }
  note: "These conditions result in dense, large and well-matured garlic bulbs with an excellent marketable appearance and long shelf life. The unique growing environment also suggests a high natural allicin content."

products:
  eyebrow: "Our garlic"
  title: "Royal variety — full transparency"
  intro: "See exactly what you are buying: Royal variety (purple, Hardneck) — appearance, internal structure and calibration of every batch."
