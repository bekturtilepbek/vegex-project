    single:
      caption: "VEGEX batch appearance"
      photo: "packaging-branded"

logistics:
  eyebrow: "Logistics and supply geography"
  title: "Reliable delivery to export markets"
  intro: "Thanks to advanced curing technology and rigorous selection of bulbs with intact protective layers, our garlic keeps for 8–10 months, maintaining premium quality even after long-distance sea freight. We work with importers and retail chains in several countries and keep expanding our reach."
  incoterms:
    - { label: "EXW" }
    - { label: "FCA" }
    - { label: "CPT" }
    - { label: "CIP" }
    - { label: "DAP" }
    - { label: "DDP*", soft: true }
  incoterms_note: "* DDP — upon agreement"
